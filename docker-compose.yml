services:
  web:
    image: eriksf/biocontainers-tacc-web:${APP_VERSION}
    command: gunicorn --bind 0.0.0.0:5000 -w 2 manage:app
    ports:
      - 5000:5000
    depends_on:
      - db
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
